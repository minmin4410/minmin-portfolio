<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メロもんた AR サンバ</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root{--red:#a3122b;--cream:#f4ecdc;--ink:#1c1614}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--cream);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;display:flex;flex-direction:column}
  header{padding:14px 18px 6px;text-align:center}
  h1{margin:0;font-size:clamp(22px,6vw,36px);font-weight:900;color:var(--red);letter-spacing:.02em}
  header p{margin:4px 0 0;font-size:13px;opacity:.75}
  model-viewer{flex:1;width:100%;min-height:320px;background:radial-gradient(circle at 50% 62%,#fff8e6 0,var(--cream) 62%);--progress-bar-color:var(--red)}
  button{font:inherit;font-weight:800;border-radius:999px;border:3px solid var(--ink);cursor:pointer;color:var(--ink);background:#fff}
  button:focus-visible{outline:3px solid #2a6df4;outline-offset:2px}
  .acts{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 10px;pointer-events:none}
  .row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
  .acts button{pointer-events:auto;font-size:14px;padding:8px 14px;min-height:44px}
  .acts .ic{width:48px;height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .acts .ic svg{width:24px;height:24px}
  .sep{width:2px;height:30px;background:var(--ink);opacity:.25;border-radius:2px}
  .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:92%;background:rgba(28,22,20,.88);color:#fff;font-size:13px;font-weight:700;line-height:1.5;padding:8px 14px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  model-viewer[ar-status="session-started"] .toast{top:calc(env(safe-area-inset-top) + 64px)}
  model-viewer[ar-status="session-started"] .acts{bottom:calc(env(safe-area-inset-bottom) + 28px)}
  .bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 14px 6px}
  .bar button{font-size:16px;padding:13px 22px;min-height:48px}
  #arBtn{background:var(--red);color:#fff}
  #arBtn[disabled]{background:#bbb;color:#555;cursor:not-allowed}
  #note{white-space:pre-line;margin:0;padding:4px 18px 16px;text-align:center;font-size:12.5px;line-height:1.6;opacity:.8}
</style>
</head>
<body>
<header>
  <h1>メロもんた AR サンバ</h1>
  <p>NO MORE SUIKA ― でもスイカは離さない</p>
</header>
<model-viewer id="mv" src="melomonta.glb" ios-src="melomonta.usdz" alt="スイカを持って踊るメロン頭のキャラクター、メロもんたの3Dモデル"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
  camera-controls touch-action="pan-y" autoplay animation-name="Dance" animation-crossfade-duration="200"
  shadow-intensity="1" shadow-softness="0.8"
  camera-orbit="20deg 80deg 3.7m" camera-target="0m 0.5m 0m" exposure="1.1">
  <span slot="ar-button"></span>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="acts">
   <div class="row">
    <button type="button" data-act="Jump">ジャンプ</button>
    <button type="button" data-act="Bonk">しゃがむ</button>
    <button type="button" data-act="Spin">くるっ</button>
    <button type="button" class="ic" id="resetRot" aria-label="元の向きに戻す" title="元の向きに戻す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
    </button>
   </div>
  </div>
</model-viewer>
<div class="bar">
  <button id="arBtn" type="button">ARで現実に出す</button>
  <button id="snd" type="button" aria-pressed="false">♪ サンバ ON</button>
</div>
<p id="note">指でドラッグすると回せます。</p>
<audio id="au" src="samba.mp3" loop preload="auto"></audio>
<script>
  const mv=document.getElementById('mv'),arBtn=document.getElementById('arBtn'),note=document.getElementById('note'),snd=document.getElementById('snd'),au=document.getElementById('au'),toastEl=document.getElementById('toast');
  let tt=null;
  function toast(msg,ms=2600){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),ms);}
  const inAR=()=>mv.getAttribute('ar-status')==='session-started';

  // ---- 効果音（その場で合成） ----
  let ac=null;
  function ctx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac;}
  function sfx(kind){
    try{
      const a=ctx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
      if(kind==='Jump'){o.type='square';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(880,t+.25);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.36);}
      else if(kind==='Bonk'){o.type='triangle';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(140,t+.18);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.31);}
      else{o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(1200,t+.5);o.frequency.linearRampToValueAtTime(400,t+.9);g.gain.setValueAtTime(.08,t);g.gain.linearRampToValueAtTime(.001,t+1);o.start(t);o.stop(t+1);}
    }catch(e){}
  }

  // ---- アクション（ボタンのみ） ----
  const DUR={Jump:1.3,Bonk:1.6,Spin:1.4};
  let busy=false,timer=null;
  function backToDance(){ if(!busy) return; busy=false; clearTimeout(timer); mv.animationName='Dance'; mv.play(); }
  function act(name){
    if(busy) return;
    busy=true; sfx(name);
    mv.animationName=name; mv.currentTime=0; mv.play({repetitions:1});
    timer=setTimeout(backToDance,(DUR[name]+0.25)*1000);
  }
  mv.addEventListener('finished',backToDance);
  document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));

  // ---- 向きを変える（AR中の2本指：ひねる＝横回転／上下になぞる＝縦回転） ----
  let yaw=0,pitch=0;
  function applyRot(){ mv.orientation=`0deg ${pitch.toFixed(1)}deg ${yaw.toFixed(1)}deg`; }
  let g2=null;
  const ang=t=>Math.atan2(t[1].clientY-t[0].clientY,t[1].clientX-t[0].clientX)*180/Math.PI;
  const midY=t=>(t[0].clientY+t[1].clientY)/2;
  mv.addEventListener('touchstart',e=>{ if(inAR()&&e.touches.length===2){ g2={a:ang(e.touches),m:midY(e.touches),y:yaw,p:pitch}; } },{passive:true});
  mv.addEventListener('touchmove',e=>{
    if(!g2||e.touches.length!==2) return;
    let d=ang(e.touches)-g2.a; if(d>180)d-=360; if(d<-180)d+=360;
    yaw=g2.y-d;
    pitch=g2.p+(midY(e.touches)-g2.m)*0.5;   // 上下に1px動かすと0.5°
    applyRot();
  },{passive:true});
  mv.addEventListener('touchend',e=>{ if(e.touches.length<2) g2=null; },{passive:true});
  document.getElementById('resetRot').addEventListener('click',()=>{ yaw=0; pitch=0; applyRot(); });

  // ---- AR・音 ----
  mv.addEventListener('load',()=>{
    if(mv.canActivateAR){note.textContent='「ARで現実に出す」を押したら、1〜2mほど前の床にカメラを向けて、ゆっくり左右に動かしてください（真下ではなく斜め前がコツ）。\n明るい場所がおすすめ。向きは2本指で変えられます（ひねる＝横回転、そろえて上下になぞる＝縦回転）。\nAR中を写真・動画に残すなら、先にスマホの画面録画を始めてからARを起動するのがおすすめです。\n※バス・電車などの乗り物の中では位置がずれるため、ご利用いただけません。\n※AR中の下のボタン操作はAndroidのみ対応です（iPhoneのARでは踊るだけになります）。';}
    else{arBtn.disabled=true;note.textContent='この画面ではARを起動できません（3Dプレビューのみ）。公開URLをスマホのSafari / Chromeで開くとARボタンが使えます。';}
  });
  arBtn.addEventListener('click',()=>{try{mv.activateAR();}catch(e){note.textContent='ARを起動できませんでした。';}});
  snd.addEventListener('click',async()=>{
    try{
      if(au.paused){await au.play();snd.textContent='♪ サンバ OFF';snd.setAttribute('aria-pressed','true');}
      else{au.pause();snd.textContent='♪ サンバ ON';snd.setAttribute('aria-pressed','false');}
    }catch(e){note.textContent='この画面では音を再生できませんでした。';}
  });
</script>
</body>
</html>
