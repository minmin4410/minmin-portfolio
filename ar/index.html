<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飛び出せみん子フレンズ</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root{--red:#a3122b;--cream:#f4ecdc;--ink:#1c1614}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--cream);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;display:flex;flex-direction:column}
  header{padding:14px 18px 4px;text-align:center}
  h1{margin:0;font-size:clamp(24px,6.5vw,38px);font-weight:900;color:var(--red);letter-spacing:.04em}
  .chars[hidden]{display:none}
  .chars{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}
  .chars button{font-size:14px;padding:6px 16px;min-height:40px;border-width:2.5px}
  .chars button[aria-pressed="true"]{background:var(--ink);color:#fff}
  model-viewer{flex:1;width:100%;min-height:320px;background:radial-gradient(circle at 50% 62%,#fff8e6 0,var(--cream) 62%);--progress-bar-color:var(--red)}
  button{font:inherit;font-weight:800;border-radius:999px;border:3px solid var(--ink);cursor:pointer;color:var(--ink);background:#fff}
  button:focus-visible{outline:3px solid #2a6df4;outline-offset:2px}
  .acts{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 8px;pointer-events:none}
  .row{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
  .acts button{pointer-events:auto;font-size:13px;padding:6px 11px;min-height:42px;border-width:2.5px}
  .acts .ic{width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .acts .ic svg{width:22px;height:22px}
  .wm{display:none;position:absolute;left:50%;transform:translateX(-50%);width:min(40%,170px);opacity:.35;pointer-events:none;user-select:none}
  model-viewer[data-ar] .wm{display:block;bottom:calc(env(safe-area-inset-bottom) + 88px)}
  .acts .arSnd{display:none}
  .arSnd .on{display:none} .arSnd[aria-pressed="true"] .on{display:inline} .arSnd[aria-pressed="true"] .off{display:none}
  .arSnd[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
  model-viewer[data-ar] .acts .arSnd{display:inline-flex}
  .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:92%;background:rgba(28,22,20,.88);color:#fff;font-size:13px;font-weight:700;line-height:1.5;padding:8px 14px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  model-viewer[data-ar] .toast{top:calc(env(safe-area-inset-top) + 64px)}
  model-viewer[data-ar] .acts{bottom:calc(env(safe-area-inset-bottom) + 28px)}
  .bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 14px 6px}
  .bar button{font-size:16px;padding:13px 22px;min-height:48px}
  #arBtn{background:var(--red);color:#fff}
  #arBtn[disabled]{background:#bbb;color:#555;cursor:not-allowed}
  .logo{text-align:center;padding:0 0 calc(14px + env(safe-area-inset-bottom))}
  .logo img{width:140px;height:auto;display:inline-block}
  #note{white-space:pre-line;margin:0;padding:2px 18px 10px;text-align:center;font-size:12.5px;line-height:1.6;opacity:.8}
</style>
</head>
<body>
<header>
  <h1>飛び出せみん子フレンズ</h1>
  <div class="chars" id="chars" role="group" aria-label="キャラクターを選ぶ"></div>
</header>
<model-viewer id="mv" alt=""
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
  camera-controls touch-action="pan-y" autoplay animation-crossfade-duration="200"
  shadow-intensity="1" shadow-softness="0.8"
  camera-orbit="20deg 80deg 3.7m" camera-target="0m 0.5m 0m" exposure="1.1">
  <span slot="ar-button"></span>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <img class="wm" src="tripo.png" alt="" aria-hidden="true">
  <div class="acts">
   <div class="row" id="actRow">
    <button type="button" class="ic" id="resetRot" aria-label="元の向きに戻す" title="元の向きに戻す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
    </button>
    <button type="button" class="ic arSnd" id="arSnd" aria-label="BGMを流す" aria-pressed="false" title="BGM ON/OFF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>
    </button>
   </div>
  </div>
</model-viewer>
<div class="bar">
  <button id="arBtn" type="button">ARで現実に出す</button>
  <button id="snd" type="button" aria-pressed="false">♪ BGM ON</button>
</div>
<p id="note">指でドラッグすると回せます。</p>
<footer class="logo"><img src="tripo.png" alt="TRIPO"></footer>
<audio id="au" loop preload="auto"></audio>
<script>
  // ===== キャラクター登録（追加するときはここに1件足す） =====
  const CHARS=[
    {id:'minko',name:'みん子',glb:'minko.glb',usdz:'minko.usdz',idle:'Idle',bgm:'minko_bgm.mp3',random:true,cam:['0m 0.7m 0m','20deg 80deg 4.9m'],
     alt:'紺色のロングヘアで水色のセーターを着た女の子、みん子の3Dモデル',
     acts:[{anim:'Wave',label:'あいさつ',dur:2.6,sfx:'chime'},
           {anim:'Beatbox',label:'ビートボックス',dur:4.0,sfx:'beatbox'},
           {anim:'Pose',label:'ポーズ',dur:2.6,sfx:'sparkle'}]},
    {id:'melomonta',name:'メロもんた',glb:'melomonta.glb',usdz:'melomonta.usdz',idle:'Dance',bgm:'samba.mp3',cam:['0m 0.5m 0m','20deg 80deg 3.7m'],
     alt:'スイカを持って踊るメロン頭のキャラクター、メロもんたの3Dモデル',
     acts:[{anim:'Jump',label:'ジャンプ',dur:1.3,sfx:'jump'},
           {anim:'Bonk',label:'しゃがむ',dur:1.6,sfx:'bonk'},
           {anim:'Spin',label:'くるっ',dur:1.4,sfx:'spin'}]},
  ];

  const mv=document.getElementById('mv'),arBtn=document.getElementById('arBtn'),note=document.getElementById('note'),snd=document.getElementById('snd'),au=document.getElementById('au'),toastEl=document.getElementById('toast'),actRow=document.getElementById('actRow'),charsEl=document.getElementById('chars'),arSnd=document.getElementById('arSnd'),resetBtn=document.getElementById('resetRot');
  let tt=null;
  function toast(msg,ms=2600){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),ms);}
  // AR中かどうか（床に置いた後は ar-status が object-placed に変わるので両方を見る）
  const AR_ON=['session-started','object-placed'];
  mv.addEventListener('ar-status',e=>{ mv.toggleAttribute('data-ar',AR_ON.includes(e.detail.status)); });
  const inAR=()=>mv.hasAttribute('data-ar');

  // ===== 効果音（その場で合成） =====
  let ac=null;
  function ctx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac;}
  function tone(type,f0,f1,dur,vol,at=0,ramp='exp'){
    const a=ctx(),t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.connect(g);g.connect(a.destination);
    o.frequency.setValueAtTime(f0,t); if(f1){ramp==='exp'?o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8):o.frequency.linearRampToValueAtTime(f1,t+dur*.8);}
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur+.02);
  }
  function noise(dur,vol,at,type,freq){
    const a=ctx(),t=a.currentTime+at,n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type=type;f.frequency.value=freq;
    s.connect(f);f.connect(g);g.connect(a.destination);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.start(t);
  }
  const SFX={
    jump:()=>tone('square',220,880,.35,.15),
    bonk:()=>tone('triangle',900,140,.3,.4),
    spin:()=>tone('sawtooth',300,1200,1,.08,0,'lin'),
    chime:()=>{[1047,1319,1568,2093].forEach((f,i)=>tone('triangle',f,0,.5,.18,i*.11));},
    sparkle:()=>{tone('sine',1800,3600,.5,.12);[2637,3136,3951].forEach((f,i)=>tone('sine',f,0,.35,.08,.25+i*.09));},
    beatbox:()=>{ // B=キック、t=ハイハット、K=スネア（アニメの拍に合わせる）
      const P='B.t.K.t.B.B.K.t.';const b0=.3,step=.25;
      for(let i=0;i<14;i++){const c=P[i%P.length],at=b0+i*step;
        if(c==='B'){tone('sine',160,45,.22,.9,at);}
        else if(c==='K'){noise(.14,.55,at,'bandpass',1800);tone('triangle',220,0,.08,.25,at);}
        else if(c==='t'){noise(.05,.3,at,'highpass',7000);}
        if(c==='.') noise(.03,.12,at,'highpass',8000);
      }},
  };
  function sfx(k){try{SFX[k]&&SFX[k]();}catch(e){}}

  // ===== キャラ切り替え・アクション =====
  let cur=null,busy=false,timer=null;
  function backToIdle(){ if(!busy) return; busy=false; clearTimeout(timer); mv.animationName=cur.idle; mv.play(); }
  function act(a,auto){
    if(busy) return;
    if(!auto) scheduleRandom();
    busy=true; sfx(a.sfx);
    mv.animationName=a.anim; mv.currentTime=0; mv.play({repetitions:1});
    timer=setTimeout(backToIdle,(a.dur+0.25)*1000);
  }
  mv.addEventListener('finished',backToIdle);
  // おまかせ：random:true のキャラは、何もしていないと数秒おきに勝手に動く
  let rndT=null;
  function scheduleRandom(){
    clearTimeout(rndT);
    if(!cur||!cur.random) return;
    rndT=setTimeout(()=>{ if(!busy&&!document.hidden) act(cur.acts[Math.floor(Math.random()*cur.acts.length)],true); scheduleRandom(); },5000+Math.random()*4000);
  }

  function selectChar(id){
    const c=CHARS.find(x=>x.id===id)||CHARS[0];
    if(cur&&cur.id===c.id) return;
    cur=c; busy=false; clearTimeout(timer);
    charsEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.id)));
    mv.setAttribute('alt',c.alt); mv.setAttribute('ios-src',c.usdz); mv.animationName=c.idle; mv.src=c.glb;
    actRow.querySelectorAll('[data-act]').forEach(b=>b.remove());
    c.acts.slice().reverse().forEach(a=>{const b=document.createElement('button');b.type='button';b.dataset.act=a.anim;b.textContent=a.label;b.addEventListener('click',()=>act(a));actRow.prepend(b);});
    yaw=0;pitch=0;applyRot();
    const playing=!au.paused; au.src=c.bgm; if(playing) au.play().catch(()=>{}); syncSnd();
    try{history.replaceState(null,'','#'+c.id);}catch(e){}
    scheduleRandom();
  }
  if(CHARS.length<2) charsEl.hidden=true;
  CHARS.forEach(c=>{const b=document.createElement('button');b.type='button';b.dataset.id=c.id;b.textContent=c.name;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>selectChar(c.id));charsEl.appendChild(b);});
  mv.addEventListener('load',()=>{ mv.animationName=cur.idle; mv.play(); mv.cameraTarget=cur.cam[0]; mv.cameraOrbit=cur.cam[1]; mv.fieldOfView='auto'; mv.jumpCameraToGoal(); });

  // ===== 向きを変える（AR中の2本指：ひねる＝横回転／上下になぞる＝縦回転） =====
  let yaw=0,pitch=0;
  function applyRot(){ mv.orientation=`0deg ${pitch.toFixed(1)}deg ${yaw.toFixed(1)}deg`; }
  let g2=null;
  const ang=t=>Math.atan2(t[1].clientY-t[0].clientY,t[1].clientX-t[0].clientX)*180/Math.PI;
  const midY=t=>(t[0].clientY+t[1].clientY)/2;
  mv.addEventListener('touchstart',e=>{ if(inAR()&&e.touches.length===2){ g2={a:ang(e.touches),m:midY(e.touches),y:yaw,p:pitch}; } },{passive:true});
  mv.addEventListener('touchmove',e=>{
    if(!g2||e.touches.length!==2) return;
    let d=ang(e.touches)-g2.a; if(d>180)d-=360; if(d<-180)d+=360;
    yaw=g2.y-d;
    pitch=g2.p+(midY(e.touches)-g2.m)*0.5;   // 上下に1px動かすと0.5°
    applyRot();
  },{passive:true});
  mv.addEventListener('touchend',e=>{ if(e.touches.length<2) g2=null; },{passive:true});
  resetBtn.addEventListener('click',()=>{ yaw=0; pitch=0; applyRot(); });

  // ===== AR・BGM =====
  let noted=false;
  mv.addEventListener('load',()=>{
    if(noted) return; noted=true;
    if(mv.canActivateAR){note.textContent='1〜2m先の床（斜め前）にカメラを向け、ゆっくり左右に動かすと現れます。\n2本指でひねる＝横回転、上下になぞる＝縦回転。撮影はスマホの画面録画で。\n※乗り物の中は非対応／ボタン操作はAndroidのみ';}
    else{arBtn.disabled=true;note.textContent='この画面ではARを使えません。スマホのChrome / Safariで開いてください。';}
  });
  arBtn.addEventListener('click',()=>{try{mv.activateAR();}catch(e){note.textContent='ARを起動できませんでした。';}});
  function syncSnd(){ const on=!au.paused; snd.textContent=on?'♪ BGM OFF':'♪ BGM ON'; snd.setAttribute('aria-pressed',String(on)); arSnd.setAttribute('aria-pressed',String(on)); arSnd.setAttribute('aria-label',on?'BGMを止める':'BGMを流す'); }
  async function toggleSnd(){
    try{ if(au.paused) await au.play(); else au.pause(); }
    catch(e){ note.textContent='この画面では音を再生できませんでした。'; toast('音を再生できませんでした'); }
    syncSnd();
  }
  snd.addEventListener('click',toggleSnd);
  arSnd.addEventListener('click',toggleSnd);

  selectChar((location.hash||'').slice(1)||CHARS[0].id);
</script>
</body>
</html>
